services:
  db:
    image: mysql:8.0
    container_name: fooddelivery_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fooddelivery
      MYSQL_USER: fooddelivery
      MYSQL_PASSWORD: fooddelivery
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: fooddelivery_api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://fooddelivery:fooddelivery@db:3306/filament
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: fooddelivery_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: fooddelivery_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

  filament:
    build: ./filament
    container_name: fooddelivery_filament
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./filament:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: >
      sh -c "if [ -f artisan ]; then
      php artisan serve --host=0.0.0.0 --port=8001;
      else echo 'Progetto Laravel non ancora creato' && tail -f /dev/null; fi"

volumes:
  db_data:
  frontend_node_modules: